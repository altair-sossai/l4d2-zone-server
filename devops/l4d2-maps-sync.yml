# Manual pipeline: synchronizes L4D2Center custom maps onto the game server.
#
# Runs the vendored bash/l4d2center-maps-sync.sh (deployed to
# /home/steam/l4d2/left4dead2/bash by azure-pipelines.yml) from the server
# addons folder, so the maps' .vpk files land directly in
# /home/steam/l4d2/left4dead2/addons.
#
# Trigger: manual only (run it from the Azure DevOps UI when you want to
# refresh the map pool). Map sync downloads can be large, so it is kept out
# of the per-commit CI.

trigger: none

pr: none

pool:
  vmImage: "ubuntu-latest"

variables:
  sshServiceConnection: "L4D2 - Server"

stages:
  - stage: L4D2MapsSync
    displayName: "Sync Left 4 Dead 2 Custom Maps"
    jobs:
      - job: L4D2MapsSync
        steps:
          - task: SSH@0
            displayName: "🗺️ Download and sync custom maps into addons"
            inputs:
              sshEndpoint: $(sshServiceConnection)
              readyTimeout: "20000"
              runOptions: "inline"
              inline: |
                set -e
                # The Azure DevOps SSH task flags the job as failed if the
                # remote command writes ANYTHING to stderr. apt (debconf /
                # needrestart warnings) and curl's progress bar do that even on
                # success, so we keep apt non-interactive/quiet and merge its
                # stderr into stdout. Real failures still fail the job because
                # of `set -e` and the non-zero exit codes.
                export DEBIAN_FRONTEND=noninteractive
                # Ensure the tools the sync script needs are present.
                sudo -E apt-get update -qq 2>&1
                sudo -E apt-get install -y -qq p7zip-full curl 2>&1
                # Run the sync from the addons folder (the script requires it).
                cd /home/steam/l4d2/left4dead2/addons
                chmod +x /home/steam/l4d2/left4dead2/bash/l4d2center-maps-sync.sh
                /home/steam/l4d2/left4dead2/bash/l4d2center-maps-sync.sh
