// Campaign Vote - l4d2_campaign_vote.sp
// Hides campaigns from the vote menu: l4d2_campaign_vote_ignore "<name>"
//   Example: l4d2_campaign_vote_ignore "HoldoutChallenge"
// Sets a custom title for a campaign: l4d2_campaign_vote_title "<name>" "<title>"
//   Example: l4d2_campaign_vote_title "DayBreak" "Day Break"
//   Example: l4d2_campaign_vote_title "dbd2dc" "Dead Before Dawn DC"
//   Example: l4d2_campaign_vote_title "DeadCenter2025" "Dead Center 2025"
// <name> must match the mission "Name" exactly (see sm_listcampaigns).

l4d2_campaign_vote_ignore "HoldoutChallenge"
l4d2_campaign_vote_ignore "HoldoutTraining"
l4d2_campaign_vote_ignore "shootzones"
l4d2_campaign_vote_ignore "box1"

l4d2_campaign_vote_ignore_lock
l4d2_campaign_vote_title_lock
