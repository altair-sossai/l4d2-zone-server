# L4D2 server inventory.
# Fill in with your server details. These values can be overridden on the
# command line with -e "ansible_host=... ansible_user=..."
#
# Do not commit real credentials — prefer passing them via -e or Ansible Vault.

[l4d2]
zone-server ansible_host=YOUR_IP

[l4d2:vars]
ansible_user=YOUR_USER
ansible_password=YOUR_PASSWORD
# Password used for "sudo" on the server (usually the same as the login):
ansible_become_password=YOUR_PASSWORD
ansible_python_interpreter=/usr/bin/python3
