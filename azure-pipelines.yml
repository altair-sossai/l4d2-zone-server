trigger:
  branches:
    include:
      - master
  paths:
    exclude:
      - docs
      - "**/*.md"
      - LICENSE
      - .github

pr: none

resources:
  pipelines:
    - pipeline: hub
      source: l4d2-playstats-hub
      trigger: true

pool:
  vmImage: "ubuntu-latest"

variables:
  sshServiceConnection: "L4D2 - Server"
  hubRepository: "altair-sossai/l4d2-playstats-hub"

stages:
  - stage: Deploy
    jobs:
      - job: CompressAndUpload
        steps:
          - script: |
              set -euo pipefail
              ref="$(resources.pipeline.hub.sourceBranch)"
              case "${ref}" in
                refs/tags/v*) url="https://github.com/$(hubRepository)/releases/download/${ref#refs/tags/}/l4d2-playstats-hub-plugins.zip" ;;
                *) url="https://github.com/$(hubRepository)/releases/latest/download/l4d2-playstats-hub-plugins.zip" ;;
              esac
              echo "Plugins from ${url}"
              curl -fsSL "${url}" -o hub-plugins.zip
              unzip -q hub-plugins.zip -d hub-plugins
              for folder in plugins translations configs; do
                cp -r "hub-plugins/left4dead2/addons/sourcemod/${folder}/." "$(Build.Repository.LocalPath)/addons/sourcemod/${folder}/"
              done
              if [ -d hub-plugins/left4dead2/materials ]; then
                mkdir -p "$(Build.Repository.LocalPath)/materials"
                cp -r hub-plugins/left4dead2/materials/. "$(Build.Repository.LocalPath)/materials/"
              fi
              rm -rf hub-plugins hub-plugins.zip
            displayName: "🧩 Add the PlayStats Hub plugins from its release"

          - script: |
              set -euo pipefail
              for name in PLAYSTATS_TOKEN RCON_PASSWORD ANTI_CHEAT_ACCESS_TOKEN; do
                value="${!name:-}"
                case "${value}" in
                  "" | *"${name}"*)
                    echo "The secret variable ${name} is not set on this pipeline."
                    exit 1
                    ;;
                esac
              done
              umask 077
              {
                printf 'rcon_password "%s"\n' "${RCON_PASSWORD}"
                printf 'playstats_token "%s"\n' "${PLAYSTATS_TOKEN}"
                printf 'sm_cvar l4d2_web_secret "%s"\n' "${PLAYSTATS_TOKEN}"
                printf 'sm_cvar anti_cheat_access_token "%s"\n' "${ANTI_CHEAT_ACCESS_TOKEN}"
              } > "$(Build.Repository.LocalPath)/cfg/server_secrets.cfg"
            displayName: "🔑 Write the server secrets"
            env:
              PLAYSTATS_TOKEN: $(PLAYSTATS_TOKEN)
              RCON_PASSWORD: $(RCON_PASSWORD)
              ANTI_CHEAT_ACCESS_TOKEN: $(ANTI_CHEAT_ACCESS_TOKEN)

          - script: |
              tar -czf addons.tar.gz -C $(Build.Repository.LocalPath)/addons .
              tar -czf cfg.tar.gz -C $(Build.Repository.LocalPath)/cfg .
              tar -czf bash.tar.gz -C $(Build.Repository.LocalPath)/bash .
              tar -czf scripts.tar.gz -C $(Build.Repository.LocalPath)/scripts .
              mkdir -p $(Build.Repository.LocalPath)/materials
              tar -czf materials.tar.gz -C $(Build.Repository.LocalPath)/materials .
            displayName: "📦 Compress folders into .tar.gz files"

          - task: SSH@0
            displayName: "🧹 Clean remote .tar.gz files"
            inputs:
              sshEndpoint: $(sshServiceConnection)
              readyTimeout: "20000"
              commands: |
                rm -rf /home/devops/$(Build.BuildId)
                mkdir -p /home/devops/$(Build.BuildId)

          - task: CopyFilesOverSSH@0
            displayName: "📤 Upload compressed files to server"
            inputs:
              sshEndpoint: $(sshServiceConnection)
              sourceFolder: "$(Build.Repository.LocalPath)"
              contents: "*.tar.gz"
              targetFolder: "/home/devops/$(Build.BuildId)"
              cleanTargetFolder: false
              overwrite: true
              readyTimeout: "20000"

          - task: CopyFilesOverSSH@0
            displayName: "📄 Upload host and motd files to game directory"
            inputs:
              sshEndpoint: $(sshServiceConnection)
              sourceFolder: "$(Build.Repository.LocalPath)"
              contents: |
                host.txt
                motd.txt
              targetFolder: "/home/steam/l4d2/left4dead2"
              cleanTargetFolder: false
              overwrite: true
              readyTimeout: "20000"

          - task: SSH@0
            displayName: "🛠️ Extract files on server and set permissions"
            inputs:
              sshEndpoint: $(sshServiceConnection)
              readyTimeout: "20000"
              commands: |
                tar -xzf /home/devops/$(Build.BuildId)/addons.tar.gz -C /home/steam/l4d2/left4dead2/addons
                mkdir -p /home/steam/l4d2/left4dead2/bash
                tar -xzf /home/devops/$(Build.BuildId)/bash.tar.gz -C /home/steam/l4d2/left4dead2/bash
                tar -xzf /home/devops/$(Build.BuildId)/cfg.tar.gz -C /home/steam/l4d2/left4dead2/cfg
                tar -xzf /home/devops/$(Build.BuildId)/scripts.tar.gz -C /home/steam/l4d2/left4dead2/scripts
                mkdir -p /home/steam/l4d2/left4dead2/materials
                tar -xzf /home/devops/$(Build.BuildId)/materials.tar.gz -C /home/steam/l4d2/left4dead2/materials
                dos2unix /home/steam/l4d2/left4dead2/bash/*.sh > /dev/null 2>&1
                chmod +x /home/steam/l4d2/left4dead2/bash/*.sh
                chmod 600 /home/steam/l4d2/left4dead2/cfg/server_secrets.cfg
                rm -f /home/steam/l4d2/left4dead2/cfg/playstats_token.cfg
                rm -rf /home/devops/$(Build.BuildId)
